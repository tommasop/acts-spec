name: CI

on:
  push:
    branches: [ master, main, 'acts-core-v*', 'v*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Build
        working-directory: ./acts-core
        run: zig build

      - name: Run unit tests
        working-directory: ./acts-core
        run: zig build test

      - name: Run plugin tests (npm)
        run: npm test

      - name: Smoke test — risk tiering + auto-land LOW
        run: |
          set -euo pipefail
          BIN="$(pwd)/acts-core/zig-out/bin/acts"
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

          mkdir -p /tmp/acts-risk && cd /tmp/acts-risk
          git init -q -b main
          echo "# app" > README.md
          git add . && git commit -qm init
          cat > package.json <<'EOF'
          { "name":"app","scripts":{"test":"node -e 'process.exit(0)'","lint":"node -e 'process.exit(0)'","build":"node -e 'process.exit(0)'"} }
          EOF
          mkdir -p .acts
          echo '{ "quality_gate": { "test":"npm test", "lint":"npm run lint", "typecheck":null, "build":"npm run build" } }' > .acts/acts.json
          git add -A && git commit -qm setup

          "$BIN" stack create demo -t "Demo"
          git add .acts && git commit -qm manifest
          "$BIN" change add c1 -t "Small feature" --accept "works"
          git add . && git commit -qm c1

          "$BIN" risk c1 | grep -q "LOW" || (echo "expected LOW risk"; exit 1)
          "$BIN" verify c1 | grep -q "risk: LOW"
          # LOW + verify + review (no remote) -> auto-approve
          "$BIN" review c1 | grep -q "auto-approved"
          "$BIN" stack land
          "$BIN" validate

      - name: Smoke test — full v2 stack lifecycle
        run: |
          set -euo pipefail
          BIN="$(pwd)/acts-core/zig-out/bin/acts"
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

          # Initialize a scratch repo so ACTS v2 can create branches
          mkdir -p /tmp/acts-ci && cd /tmp/acts-ci
          git init -q -b main
          echo "# ci" > README.md
          git add . && git commit -qm init

          # Minimal package.json so quality gates auto-detect
          mkdir -p .acts
          cat > package.json <<'EOF'
          { "name":"ci","scripts":{"test":"node -e 'process.exit(0)'","lint":"node -e 'process.exit(0)'","build":"node -e 'process.exit(0)'"} }
          EOF
          cat > .acts/acts.json <<'EOF'
          { "quality_gate": { "test":"npm test", "lint":"npm run lint", "typecheck":null, "build":"npm run build" } }
          EOF
          git add -A && git commit -qm "setup"

          "$BIN" version
          "$BIN" stack create ci -t "CI stack"
          git add .acts && git commit -qm "stack manifest"
          "$BIN" change add c1 -t "Feature" --accept "works"
          git add . && git commit -qm "c1"

          # Gate: review must fail before verify
          if "$BIN" review c1 2>/dev/null; then
            echo "ERROR: review should have been blocked before verify"
            exit 1
          fi

          "$BIN" verify c1
          "$BIN" approve c1
          "$BIN" stack land

          "$BIN" stack status
          "$BIN" validate

      - name: Smoke test — v1 → v2 migration
        run: |
          set -euo pipefail
          BIN="$(pwd)/acts-core/zig-out/bin/acts"
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

          mkdir -p /tmp/acts-ci-migrate && cd /tmp/acts-ci-migrate
          git init -q -b main
          echo "# migrate" > README.md
          git add . && git commit -qm init

          # Create a minimal v1-style SQLite DB
          mkdir -p .acts
          sqlite3 .acts/acts.db "
            CREATE TABLE stories (id TEXT PRIMARY KEY, title TEXT, status TEXT, type TEXT);
            CREATE TABLE tasks (id TEXT PRIMARY KEY, story_id TEXT, title TEXT, status TEXT, review_status TEXT);
            INSERT INTO stories VALUES ('LEGACY', 'Legacy Story', 'IN_PROGRESS', 'feature');
            INSERT INTO tasks VALUES ('t1', 'LEGACY', 'Task One', 'DONE', 'approved');
            INSERT INTO tasks VALUES ('t2', 'LEGACY', 'Task Two', 'IN_PROGRESS', 'pending');
          "

          "$BIN" migrate LEGACY
          "$BIN" stack status
          "$BIN" validate

      - name: Smoke test — acts setup (project bootstrap)
        run: |
          set -euo pipefail
          BIN="$(pwd)/acts-core/zig-out/bin/acts"
          SPEC="$(pwd)"
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

          mkdir -p /tmp/acts-setup && cd /tmp/acts-setup
          git init -q -b main
          echo "# app" > README.md
          git add . && git commit -qm init

          # Bootstrap without cloning acts-spec (--source = this checkout, --no-install)
          "$BIN" setup . --no-install --source "$SPEC" --github

          # Verify the integration files + config landed
          test -f .opencode/plugins/acts.js
          test -f .opencode/plugins/cbm.js
          test -f .opencode/skills/acts/SKILL.md
          test -f .github/workflows/opencode.yml
          grep -q "ACTS Integration (v2)" AGENTS.md
          grep -q '"permission"' opencode.json
          grep -q 'acts.js' opencode.json
          echo "OK: setup wired AGENTS.md + opencode.json + plugins + github workflow"

          # Idempotent: re-run adds no duplicate ACTS section
          "$BIN" setup . --no-install --source "$SPEC"
          test "$(grep -c 'ACTS Integration (v2)' AGENTS.md)" = "1"
          echo "OK: setup is idempotent"

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Build release
        working-directory: ./acts-core
        run: zig build release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: acts-linux-x86_64
          path: acts-core/zig-out/bin/acts
          if-no-files-found: error
